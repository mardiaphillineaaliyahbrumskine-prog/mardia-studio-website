<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MARDIA STUDIO — AI filmmaking tools for creators, storytellers, filmmakers, partners and the global creative community.">
  <title>MARDIA STUDIO — AI Filmmaking Studio</title>

  <style>
    :root {
      --bg: #07070b;
      --bg-soft: #101018;
      --card: #15151f;
      --card-2: #1b1b27;
      --text: #f7f5ff;
      --muted: #aaa8b9;
      --gold: #d8b46a;
      --gold-light: #f1d79a;
      --purple: #8d6cff;
      --border: rgba(255,255,255,.10);
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 80% 10%, rgba(141,108,255,.15), transparent 28%),
        radial-gradient(circle at 15% 35%, rgba(216,180,106,.08), transparent 25%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(92%, var(--max));
      margin: auto;
    }

    /* NAVIGATION */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(18px);
      background: rgba(7,7,11,.82);
      border-bottom: 1px solid var(--border);
    }

    nav {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border: 2px solid var(--gold);
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-weight: 900;
      font-size: 18px;
      box-shadow: 0 0 22px rgba(216,180,106,.15);
    }

    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 14px;
      transition: .25s;
    }

    .nav-links a:hover {
      color: var(--gold-light);
    }

    .nav-button {
      padding: 10px 17px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      color: var(--gold-light) !important;
    }

    /* HERO */

    .hero {
      min-height: 86vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 100px 0 90px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(141,108,255,.12);
      filter: blur(100px);
      border-radius: 50%;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-block;
      color: var(--gold-light);
      border: 1px solid rgba(216,180,106,.35);
      background: rgba(216,180,106,.06);
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(48px, 9vw, 100px);
      line-height: .98;
      letter-spacing: -4px;
      max-width: 1000px;
      margin: auto;
    }

    .hero h1 span {
      color: var(--gold-light);
    }

    .hero-text {
      max-width: 720px;
      margin: 28px auto;
      color: var(--muted);
      font-size: clamp(17px, 2.3vw, 21px);
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 700;
      transition: .25s;
      border: 1px solid var(--border);
    }

    .button-primary {
      background: var(--gold);
      color: #101015;
    }
